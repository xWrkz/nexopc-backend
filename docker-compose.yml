services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - wordpress_db:/var/lib/mysql
    networks:
      - wordpress_internal

  wordpress:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress_files:/var/www/html
    ports:
      - "${WORDPRESS_HTTP_PORT:-8080}:80"
    expose:
      - "80"
    networks:
      - wordpress_internal
      - dokploy-network
      - default
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.nexopc-backend-qw04wv-4-web.rule=Host(`wordpress.wrkz.net`)
      - traefik.http.routers.nexopc-backend-qw04wv-4-web.entrypoints=web
      - traefik.http.routers.nexopc-backend-qw04wv-4-web.middlewares=redirect-to-https@file
      - traefik.http.routers.nexopc-backend-qw04wv-4-web.service=nexopc-backend-qw04wv-4-web
      - traefik.http.routers.nexopc-backend-qw04wv-4-websecure.rule=Host(`wordpress.wrkz.net`)
      - traefik.http.routers.nexopc-backend-qw04wv-4-websecure.entrypoints=websecure
      - traefik.http.routers.nexopc-backend-qw04wv-4-websecure.service=nexopc-backend-qw04wv-4-websecure
      - traefik.http.routers.nexopc-backend-qw04wv-4-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.nexopc-backend-qw04wv-4-web.loadbalancer.server.port=80
      - traefik.http.services.nexopc-backend-qw04wv-4-websecure.loadbalancer.server.port=80
      - traefik.enable=true

volumes:
  wordpress_db:
  wordpress_files:

networks:
  wordpress_internal:
  default:
  dokploy-network:
    external: true
